<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garantías - WiiU Games</title>
    <script>
      let activeUser = null;
      try {
        activeUser = JSON.parse(
          sessionStorage.getItem("wiiu_usuario_activo") || "null",
        );
      } catch (error) {}

      const profileTarget = "panel_usuario.html?view=garantias";
      const destination = activeUser?.token
        ? profileTarget
        : `Login.html?returnTo=${encodeURIComponent(profileTarget)}`;
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p>Abriendo Garantías dentro de tu perfil...</p>
  </body>
</html>
